[package]
name = "sponsor-shell"
version = "0.1.3"
edition = "2021"
description = "A sponsored terminal shell wrapper with persistent ASCII ad inventory."
license = "MIT"
repository = "https://github.com/atkunja/moneymux-sponsor-shell"
homepage = "https://moneymux.com"
rust-version = "1.96"

[dependencies]
anyhow = "1"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
url = "2"
